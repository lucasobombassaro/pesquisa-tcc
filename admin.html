<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Admin · Respostas TCC</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <style>
    :root {
      --bg:       #f2f2f7;
      --surface:  rgba(255,255,255,0.82);
      --solid:    #ffffff;
      --border:   rgba(0,0,0,0.09);
      --blue:     #0071e3;
      --blue-h:   #005bbf;
      --blue-lt:  rgba(0,113,227,0.10);
      --green:    #34c759;
      --green-lt: rgba(52,199,89,0.12);
      --red:      #ff3b30;
      --red-lt:   rgba(255,59,48,0.10);
      --text:     #1d1d1f;
      --text2:    #6e6e73;
      --text3:    #8e8e93;
      --r-sm:     10px;
      --r-md:     16px;
      --r-lg:     22px;
      --shadow:   0 2px 20px rgba(0,0,0,0.07), 0 0 0 1px rgba(0,0,0,0.04);
      --shadow-lg:0 16px 56px rgba(0,0,0,0.16);
      --ease:     cubic-bezier(0.4,0,0.2,1);
    }
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
    body {
      font-family:'Inter',-apple-system,sans-serif;
      background:var(--bg); color:var(--text);
      min-height:100dvh;
      -webkit-font-smoothing:antialiased;
    }
    body::before {
      content:''; position:fixed; inset:0; pointer-events:none;
      background:
        radial-gradient(ellipse 80% 50% at 20% -10%, rgba(0,113,227,0.07) 0%,transparent 60%),
        radial-gradient(ellipse 60% 40% at 80% 110%, rgba(52,199,89,0.05) 0%,transparent 60%);
    }

    /* ── HEADER ── */
    .header {
      position:sticky; top:0; z-index:100;
      background:rgba(242,242,247,0.9);
      backdrop-filter:blur(20px) saturate(180%);
      border-bottom:1px solid var(--border);
    }
    .header-inner {
      max-width:860px; margin:0 auto;
      display:flex; align-items:center; gap:12px;
      height:56px; padding:0 20px;
    }
    .header-title { font-size:16px; font-weight:700; flex:1; }
    .header-title span { color:var(--blue); }

    .live-pill {
      display:flex; align-items:center; gap:5px;
      padding:4px 10px; border-radius:20px;
      font-size:11px; font-weight:600;
      background:var(--green-lt); color:var(--green);
      border:1px solid rgba(52,199,89,0.25);
    }
    .live-pill.off { background:var(--red-lt); color:var(--red); border-color:rgba(255,59,48,.25); }
    .live-dot {
      width:6px; height:6px; border-radius:50%; background:currentColor;
      animation:pdot 1.8s ease-in-out infinite;
    }
    @keyframes pdot { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.4;transform:scale(.6)} }

    /* ── STATS ── */
    .stats {
      max-width:860px; margin:0 auto;
      padding:20px 20px 0;
      display:grid; grid-template-columns:repeat(3,1fr); gap:12px;
    }
    .stat-card {
      background:var(--surface); border:1px solid var(--border);
      border-radius:var(--r-md); padding:16px;
      box-shadow:var(--shadow); backdrop-filter:blur(10px);
    }
    .stat-num   { font-size:30px; font-weight:700; line-height:1; margin-bottom:4px; }
    .stat-label { font-size:12px; color:var(--text2); font-weight:500; }
    .stat-card.blue   .stat-num { color:var(--blue); }
    .stat-card.green  .stat-num { color:var(--green); }
    .stat-card.orange .stat-num { color:#ff9500; }

    /* ── META / GAMIFICAÇÃO ── */
    .meta-card {
      max-width:860px; margin:12px auto 0;
      padding:0 20px;
    }
    .meta-inner {
      background:var(--surface); border:1px solid var(--border);
      border-radius:var(--r-md); padding:18px 20px;
      box-shadow:var(--shadow); backdrop-filter:blur(10px);
    }
    .meta-top {
      display:flex; align-items:center; justify-content:space-between;
      margin-bottom:10px;
    }
    .meta-title { font-size:13px; font-weight:600; color:var(--text2); }
    .meta-count {
      font-size:13px; font-weight:700;
    }
    .meta-count .cur { color:var(--blue); font-size:20px; }
    .meta-count .sep { color:var(--text3); margin:0 2px; }
    .meta-count .goal { color:var(--text3); }

    .prog-track {
      height:8px; background:rgba(0,0,0,0.07);
      border-radius:4px; overflow:hidden; margin-bottom:10px;
    }
    .prog-fill {
      height:100%;
      background:linear-gradient(90deg, var(--blue) 0%, var(--green) 100%);
      border-radius:4px;
      transition:width .8s var(--ease);
      position:relative;
    }
    .prog-fill::after {
      content:'';
      position:absolute; right:0; top:0; bottom:0;
      width:4px; border-radius:2px;
      background:rgba(255,255,255,0.5);
      animation:shimmer 1.5s ease-in-out infinite;
    }
    @keyframes shimmer { 0%,100%{opacity:0} 50%{opacity:1} }

    .meta-milestones {
      display:flex; gap:0; position:relative;
      margin-bottom:8px;
    }
    .milestone {
      flex:1; display:flex; flex-direction:column; align-items:center;
      position:relative;
    }
    .milestone-dot {
      width:10px; height:10px; border-radius:50%;
      border:2px solid var(--border);
      background:var(--bg);
      margin-bottom:4px;
      transition:all .4s var(--ease);
    }
    .milestone.done .milestone-dot {
      background:var(--green); border-color:var(--green);
      box-shadow:0 0 0 3px var(--green-lt);
    }
    .milestone-label {
      font-size:10px; color:var(--text3); font-weight:500;
      white-space:nowrap;
    }
    .milestone.done .milestone-label { color:var(--green); font-weight:600; }

    .meta-msg {
      font-size:12px; color:var(--text2); font-weight:500;
      text-align:center; padding-top:4px;
    }
    .meta-msg strong { color:var(--blue); }

    /* ── NOTIF ── */
    .notif {
      display:none; position:fixed; top:68px; left:50%;
      transform:translateX(-50%);
      background:var(--blue); color:#fff;
      padding:10px 18px; border-radius:20px;
      font-size:13px; font-weight:600;
      box-shadow:0 4px 20px rgba(0,113,227,.45);
      z-index:300; cursor:pointer;
    }
    .notif.show { display:block; animation:popIn .3s var(--ease); }
    @keyframes popIn { from{opacity:0;transform:translateX(-50%) scale(.9)} to{opacity:1;transform:translateX(-50%) scale(1)} }

    /* ── CONTROLS ── */
    .controls {
      max-width:860px; margin:0 auto;
      padding:16px 20px;
      display:flex; gap:10px; flex-wrap:wrap; align-items:center;
    }
    .search-wrap { flex:1; min-width:180px; position:relative; }
    .search-wrap svg { position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--text3); pointer-events:none; }
    .search-input {
      width:100%; padding:10px 12px 10px 36px;
      border:1.5px solid var(--border); border-radius:var(--r-sm);
      font-family:inherit; font-size:14px;
      background:var(--solid); color:var(--text); outline:none;
      transition:border-color .2s;
    }
    .search-input:focus { border-color:var(--blue); }

    /* ── LIST ── */
    .list-wrap {
      max-width:860px; margin:0 auto;
      padding:0 20px 80px;
    }
    .list-label {
      font-size:12px; font-weight:600; color:var(--text3);
      text-transform:uppercase; letter-spacing:.5px;
      margin-bottom:8px;
    }

    .resp-card {
      background:var(--surface); border:1px solid var(--border);
      border-radius:var(--r-md); margin-bottom:8px;
      padding:14px 16px;
      display:grid; grid-template-columns:auto 1fr auto;
      gap:12px; align-items:center;
      box-shadow:var(--shadow); backdrop-filter:blur(10px);
      transition:transform .15s var(--ease);
      animation:cardIn .2s var(--ease) both;
    }
    @keyframes cardIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:none} }
    .resp-card:hover { transform:translateY(-1px); }
    .resp-card.new-glow { box-shadow:0 0 0 2px var(--blue), var(--shadow); }
    .resp-card.latest {
      border-color:rgba(0,113,227,0.35);
      background:linear-gradient(135deg, rgba(0,113,227,0.06) 0%, rgba(255,255,255,0.9) 100%);
    }
    .latest-badge {
      display:inline-flex; align-items:center; gap:4px;
      padding:3px 8px; border-radius:20px;
      font-size:10px; font-weight:700; letter-spacing:.3px;
      background:var(--blue); color:#fff;
      margin-bottom:5px; text-transform:uppercase;
    }
    .latest-time {
      font-size:11px; color:var(--blue); font-weight:600;
    }

    .avatar {
      width:42px; height:42px; border-radius:50%;
      display:flex; align-items:center; justify-content:center;
      font-size:15px; font-weight:700; color:#fff; flex-shrink:0;
    }
    .r-num {
      font-size:10px; font-weight:700; color:var(--text3);
      text-align:center; margin-top:3px; letter-spacing:.3px;
    }
    .r-name  { font-size:15px; font-weight:600; margin-bottom:2px; }
    .r-email { font-size:12px; color:var(--text2); }
    .r-meta  { font-size:11px; color:var(--text3); margin-top:3px; }

    .r-right { text-align:right; flex-shrink:0; }
    .badge-ok {
      display:inline-flex; align-items:center; gap:4px;
      padding:4px 10px; border-radius:20px;
      font-size:11px; font-weight:600;
      background:var(--green-lt); color:var(--green);
      border:1px solid rgba(52,199,89,0.2);
      margin-bottom:4px;
    }
    .r-date { font-size:11px; color:var(--text3); }

    .empty {
      text-align:center; padding:60px 20px; color:var(--text3);
    }
    .empty p { font-size:14px; margin-top:10px; }

    /* ── TOAST ── */
    .toast {
      position:fixed; bottom:30px; left:50%;
      transform:translateX(-50%) translateY(20px);
      background:rgba(28,28,30,0.92); backdrop-filter:blur(10px);
      color:#fff; padding:10px 20px; border-radius:20px;
      font-size:13px; font-weight:500;
      opacity:0; transition:all .3s var(--ease);
      z-index:9999; pointer-events:none; white-space:nowrap;
    }
    .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
  </style>
</head>
<body>

<div class="header">
  <div class="header-inner">
    <div class="header-title">Respostas <span>·</span> TCC</div>
    <div class="live-pill off" id="live-pill">
      <span class="live-dot"></span>
      <span id="live-label">Conectando...</span>
    </div>
  </div>
</div>

<div class="notif" id="notif" onclick="this.classList.remove('show')"></div>

<div class="stats">
  <div class="stat-card blue">
    <div class="stat-num" id="s-total">—</div>
    <div class="stat-label">Total</div>
  </div>
  <div class="stat-card green">
    <div class="stat-num" id="s-today">—</div>
    <div class="stat-label">Hoje</div>
  </div>
  <div class="stat-card orange">
    <div class="stat-num" id="s-week">—</div>
    <div class="stat-label">Esta semana</div>
  </div>
</div>

<!-- META 150 -->
<div class="meta-card">
  <div class="meta-inner">
    <div class="meta-top">
      <div class="meta-title">Meta da pesquisa</div>
      <div class="meta-count">
        <span class="cur" id="m-cur">0</span>
        <span class="sep">/</span>
        <span class="goal">150 respostas</span>
      </div>
    </div>
    <div class="prog-track">
      <div class="prog-fill" id="m-fill" style="width:0%"></div>
    </div>
    <div class="meta-milestones">
      <div class="milestone" id="ms-25">
        <div class="milestone-dot"></div>
        <div class="milestone-label">25%</div>
      </div>
      <div class="milestone" id="ms-50">
        <div class="milestone-dot"></div>
        <div class="milestone-label">50%</div>
      </div>
      <div class="milestone" id="ms-75">
        <div class="milestone-dot"></div>
        <div class="milestone-label">75%</div>
      </div>
      <div class="milestone" id="ms-100">
        <div class="milestone-dot"></div>
        <div class="milestone-label">100%</div>
      </div>
    </div>
    <div class="meta-msg" id="m-msg"></div>
  </div>
</div>

<div class="controls">
  <div class="search-wrap">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
    </svg>
    <input class="search-input" id="search" placeholder="Buscar por nome ou e-mail..." oninput="render()" />
  </div>
</div>

<div class="list-wrap">
  <div class="list-label" id="list-label">Carregando...</div>
  <div id="list"></div>
</div>

<div class="toast" id="toast"></div>

<script>
const SB_URL = 'https://wehpbpczgjxhjievamnz.supabase.co';
const SB_KEY = 'sb_publishable_bY-yOvgZcZ3QM0MUjZxUlg_9onwMIvT';
const GOAL   = 150;

let sb, rows = [];

const COLORS = ['#0071e3','#34c759','#ff9500','#af52de','#ff3b30','#5ac8fa','#30b0c7','#ff6b35'];
const avatarColor = n => COLORS[(n||'?').charCodeAt(0) % COLORS.length];
const initials    = n => (n||'?').trim().split(/\s+/).map(w=>w[0]).join('').slice(0,2).toUpperCase();

async function init(){
  sb = window.supabase.createClient(SB_URL, SB_KEY);
  const { data } = await sb.from('respostas')
    .select('id,nome,email,created_at,idade,genero,area_atuacao')
    .order('created_at', { ascending: false });
  rows = data || [];
  updateStats();
  render();
  setupRealtime();
}

function setupRealtime(){
  const pill  = document.getElementById('live-pill');
  const label = document.getElementById('live-label');

  sb.channel('admin-rt')
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'respostas' }, p => {
      rows.unshift(p.new);
      updateStats(); render();
      showNotif(p.new);
      setTimeout(() => {
        const el = document.querySelector('.resp-card');
        if(el){ el.classList.add('new-glow'); setTimeout(()=>el.classList.remove('new-glow'), 3000); }
      }, 50);
    })
    .subscribe(s => {
      if(s === 'SUBSCRIBED'){
        pill.className = 'live-pill'; label.textContent = 'Ao vivo';
      } else if(s === 'CLOSED' || s === 'CHANNEL_ERROR'){
        pill.className = 'live-pill off'; label.textContent = 'Offline';
      }
    });
}

function showNotif(r){
  const el = document.getElementById('notif');
  el.textContent = '✓ ' + (r.nome || 'Alguém') + ' acabou de responder!';
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 5000);
}

function updateStats(){
  const n       = rows.length;
  const now     = new Date();
  const today   = now.toISOString().slice(0,10);
  const weekAgo = new Date(now - 7*864e5).toISOString();
  const pct     = Math.min(Math.round(n / GOAL * 100), 100);
  const left    = GOAL - n;

  document.getElementById('s-total').textContent = n;
  document.getElementById('s-today').textContent = rows.filter(r => (r.created_at||'').startsWith(today)).length;
  document.getElementById('s-week').textContent  = rows.filter(r => r.created_at >= weekAgo).length;

  // meta
  document.getElementById('m-cur').textContent        = n;
  document.getElementById('m-fill').style.width       = pct + '%';

  // milestones
  [['ms-25',25],['ms-50',50],['ms-75',75],['ms-100',100]].forEach(([id,p])=>{
    document.getElementById(id).classList.toggle('done', pct >= p);
  });

  // message
  let msg;
  if(n === 0)        msg = 'Nenhuma resposta ainda. Compartilhe o link!';
  else if(left > 0)  msg = 'Faltam <strong>' + left + '</strong> para atingir a meta de 150.';
  else               msg = '🎉 Meta atingida! Parabéns!';
  document.getElementById('m-msg').innerHTML = msg;
}

function render(){
  const q = (document.getElementById('search').value || '').toLowerCase();

  // sempre mais recente primeiro
  const items = [...rows]
    .sort((a,b) => new Date(b.created_at) - new Date(a.created_at))
    .filter(r =>
      !q ||
      (r.nome  || '').toLowerCase().includes(q) ||
      (r.email || '').toLowerCase().includes(q)
    );

  document.getElementById('list-label').textContent =
    items.length + ' resposta' + (items.length !== 1 ? 's' : '');

  const listEl = document.getElementById('list');
  if(!items.length){
    listEl.innerHTML =
      '<div class="empty">' +
        '<svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 12h6m-3-3v6"/><rect x="3" y="3" width="18" height="18" rx="4"/></svg>' +
        '<p>' + (rows.length ? 'Nenhum resultado para a busca.' : 'Nenhuma resposta recebida ainda.') + '</p>' +
      '</div>';
    return;
  }

  listEl.innerHTML = items.map((r, i) => {
    const color = avatarColor(r.nome);
    const ini   = initials(r.nome);
    const meta  = [r.idade, r.genero, r.area_atuacao].filter(Boolean).join(' · ');
    const num     = rows.length - rows.indexOf(r);
    const isFirst = i === 0;
    return (
      '<div class="resp-card' + (isFirst ? ' latest' : '') + '" style="animation-delay:' + Math.min(i,15)*18 + 'ms">' +
        '<div>' +
          '<div class="avatar" style="background:' + color + '">' + ini + '</div>' +
          '<div class="r-num">#' + num + '</div>' +
        '</div>' +
        '<div>' +
          (isFirst ? '<div class="latest-badge">Última resposta</div>' : '') +
          '<div class="r-name">' + esc(r.nome || '—') + '</div>' +
          '<div class="r-email">' + esc(r.email || '—') + '</div>' +
          (meta ? '<div class="r-meta">' + esc(meta) + '</div>' : '') +
        '</div>' +
        '<div class="r-right">' +
          '<div class="badge-ok">✓ Respondeu</div>' +
          '<div class="r-date ' + (isFirst ? 'latest-time' : '') + '">' + fmtDate(r.created_at) + '</div>' +
        '</div>' +
      '</div>'
    );
  }).join('');
}

function fmtDate(iso){
  if(!iso) return '—';
  return new Date(iso).toLocaleDateString('pt-BR',{
    day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit'
  });
}
function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

init();
</script>
</body>
</html>
